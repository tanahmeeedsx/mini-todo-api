name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Verify secret is available
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          if [ -n "$APP_SECRET" ]; then
            echo "APP_SECRET is configured"
          else
            echo "APP_SECRET is missing"
            exit 1
          fi

      - name: Dependency security scan
        run: |
          python -m pip install --upgrade setuptools pip-audit
          pip-audit

      - name: Lint with flake8
        run: |
          flake8 app/ --count --show-source --statistics

      - name: Run tests
        run: |
          python -m pytest
